version: '3.9'

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - '3000:3000'
    environment:
      - CHAINGUARD_API_URL=http://backend:8000
      - CHAINGUARD_INTERNAL_TOKEN=${CHAINGUARD_INTERNAL_TOKEN}
      - CHAINGUARD_AI_MODEL=${CHAINGUARD_AI_MODEL:-anthropic/claude-sonnet-5}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - chainguard

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - '8000:8000'
    environment:
      - CHAINGUARD_DATA_DIR=/data
      - CHAINGUARD_INTERNAL_TOKEN=${CHAINGUARD_INTERNAL_TOKEN}
      - CHAINGUARD_AI_REASON_URL=http://frontend:3000/api/internal/reason
      - CHAINGUARD_ALLOWED_ORIGINS=http://localhost:3000,http://frontend:3000
      - GITHUB_TOKEN=${GITHUB_TOKEN}
    volumes:
      - chainguard-data:/data
    networks:
      - chainguard
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://localhost:8000/health']
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  chainguard-data:

networks:
  chainguard:
    driver: bridge
